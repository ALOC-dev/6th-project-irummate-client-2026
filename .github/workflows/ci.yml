name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build (app)
        run: npx vite build
      - name: Build (admin-web)
        run: npx vite build --mode admin-web --outDir dist-admin-web
      - name: Check no MSW worker in builds
        run: test ! -f dist/mockServiceWorker.js && test ! -f dist-admin-web/mockServiceWorker.js
