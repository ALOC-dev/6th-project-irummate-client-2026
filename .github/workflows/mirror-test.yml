name: Mirror test to deploy fork

on:
  push:
    branches: [test]

concurrency:
  group: mirror-test
  cancel-in-progress: false

permissions: {}

jobs:
  mirror:
    # 포크에도 이 파일이 복사되므로, 원본 저장소에서만 실행
    if: github.repository == 'ALOC-dev/6th-project-irummate-client-2026'
    runs-on: ubuntu-latest
    steps:
      - name: Push test to fork
        env:
          TOKEN: ${{ secrets.TEST_DEPLOY_FORK_TOKEN }}
          FORK: iaruok/irummate-client
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init -q mirror
          cd mirror
          git fetch -q --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" "+refs/heads/test:refs/remotes/origin/test"
          # 강제 push 아님: 포크 test에 원본에 없는 커밋이 있으면 실패하고 멈춤
          git push -q "https://x-access-token:${TOKEN}@github.com/${FORK}.git" "${SHA}:refs/heads/test"
